[project]
name = "cim-python-sdk"
version = "0.1.0"
description = "Python SDK for all CIM100 classes, generated from the CIM UG EA model"
authors = [
    { name = "Michael Liu", email = "104720972+michael-z-liu@users.noreply.github.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cim_python_sdk"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
codegen = [
    "jinja2",
]

[tool.uv]
default-groups = ["dev", "codegen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Generated code: long CIM docstring headers, module paths and GUID tables, and CIM attribute
# names such as `l` (E741) come straight from the model.
"src/cim_python_sdk/model/**" = ["E501", "E741"]
"src/cim_python_sdk/_registry.py" = ["E501"]
# Generated by tools/gen_profile_stubs.py: long module paths, import order follows the class names.
"src/cim_python_sdk/profiles/cgmes3.pyi" = ["E501", "I001"]
